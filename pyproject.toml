[project]
name = "emusync"
version = "0.2.0"
description = "Steam Cloud style save sync for EmuDeck"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "tomli-w>=1.0"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
emusync = "emusync.cli:main"

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
